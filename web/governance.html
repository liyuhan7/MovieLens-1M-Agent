<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieLens 数据治理工作台</title>
<style>
:root{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#18283b;background:#f1f4f8}
*{box-sizing:border-box}body{margin:0}header{background:#142b46;color:white;padding:22px 5vw}h1{margin:0;font-size:24px}header p{margin:6px 0;color:#bacbe0}a{color:#2760b3}header a{color:#c8deff}main{padding:24px 5vw;display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:20px;margin-bottom:18px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #c9d3df;border-radius:6px}button{cursor:pointer;background:#edf3fb;color:#214b85}button.primary{background:#245da5;color:white}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{display:block;color:#566779;margin:8px 0}input,textarea{width:100%}.muted{color:#66778b}#error{color:#ae2834;background:#fff0f1;padding:12px;border-radius:8px;margin-bottom:16px}#error:empty{display:none}.task{width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere;background:white}.task.selected{border-color:#245da5;background:#edf3fb}.badge{display:inline-block;border-radius:5px;background:#edf3fb;padding:2px 7px;margin-right:8px}.ok{color:#157049;background:#e8f6ee}.bad{color:#b12939;background:#fdecee}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,monospace;background:#f6f8fb;padding:12px;border-radius:6px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;text-align:left;border-bottom:1px solid #e3e9f0;overflow-wrap:anywhere}details{margin:8px 0}#identity{overflow-wrap:anywhere}.scroll{overflow-x:auto}#ask-answer{white-space:pre-wrap}#evidence article{border:1px solid #e3e9f0;border-radius:8px;padding:12px;margin-top:10px}#compare{overflow-wrap:anywhere}@media(max-width:850px){main{grid-template-columns:1fr;padding:16px}header{padding:20px}section{padding:16px}}
</style></head>
<body><header><h1>MovieLens 数据治理工作台</h1><p>提交清洗任务，跟踪执行，查询正式结果和记录处理依据。</p><a href="/index.html">自然语言任务与原 Agent 界面</a></header>
<main><aside><section><h2>任务操作</h2><p class="muted">使用已配置的用户、电影和评分输入，以及默认清洗规则。</p><button class="primary" id="submit">提交清洗任务</button><p id="submit-status" role="status"></p><button id="refresh">刷新任务列表</button><div id="tasks" style="margin-top:16px"></div><button id="more" hidden>更早的任务</button></section></aside>
<div><div id="error" role="alert"></div><section><h2>当前任务</h2><p id="empty">从左侧选择任务，或提交新的清洗任务。</p><div id="identity"></div><button id="retry" hidden>失败后重试</button><details id="jobs-panel" hidden><summary>执行尝试与计算作业</summary><div id="jobs"></div></details></section>
<section id="result-panel" hidden><h2>正式结果</h2><p id="publish"></p><div id="scores" class="scroll"></div><details><summary>数据变化与处理数量</summary><pre id="changes"></pre></details><details><summary>报告局限</summary><pre id="limitations"></pre></details><a id="download">下载完整报告</a></section>
<section id="evidence-panel" hidden><h2>查看处理依据</h2><div class="row"><label>数据表<select id="source-table"><option value="">全部</option><option>users</option><option>movies</option><option>ratings</option></select></label><label>规则编号<input id="rule" placeholder="例如 U6"></label><label>指标<input id="metric" placeholder="例如 unique"></label></div><label>来源记录 ID<input id="source-id" placeholder="从记录依据中复制完整 ID"></label><button id="find-evidence">查询依据</button><p class="muted">依据来自当前任务正式发布的 Parquet 文件，已核对发布清单和索引身份。</p><div id="evidence"></div><button id="evidence-more" hidden>下一页依据</button></section>
<section><h2>版本比较</h2><label>左侧正式任务<select id="left"></select></label><label>右侧正式任务<select id="right"></select></label><button id="compare-button">比较正式版本</button><div id="compare"></div></section>
<section id="analysis-panel" hidden><h2>历史分析与计算指标</h2><div class="row"><button id="history-analysis">查询 Hive 历史统计</button><button id="performance">采集本次作业性能</button></div><p class="muted">历史统计需要已配置 Hive 并登记正式分区。计算指标以 JobHistory 实际采集结果为准。</p><div id="analysis"></div></section>
<section id="ask-panel" hidden><h2>向 Agent 追问当前报告</h2><label>问题<textarea id="question" rows="3" placeholder="例如：哪些记录被隔离？"></textarea></label><button id="ask">发送问题</button><p id="ask-answer"></p></section>
</div></main>
<script src="/governance.js"></script></body></html>
